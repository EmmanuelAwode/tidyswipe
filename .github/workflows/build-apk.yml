name: Build Android APK

# Builds an installable Android APK and publishes it as a GitHub Release.
# Run it from the Actions tab, or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" Tidyswipe.apk
          ls -lh Tidyswipe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tidyswipe-apk
          path: Tidyswipe.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="android-build-${{ github.run_number }}"; fi
          gh release create "$TAG" Tidyswipe.apk \
            --title "Tidyswipe for Android ($TAG)" \
            --notes "Download Tidyswipe.apk on your Android phone and open it to install. Android will ask you to allow installs from your browser the first time." \
            --target "${{ github.sha }}"
